name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Shell syntax
        run: for f in bin/* install.sh; do bash -n "$f"; done
      - name: Clean code gate
        run: bash bin/clean-code.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a temp home
        run: |
          export OMP_MEMORY_HOME="$RUNNER_TEMP/mem"
          bash install.sh
          source "$RUNNER_TEMP/mem/env.sh"
          omp-memory capture --task "ci smoke" --outcome "install works" --verified
          omp-memory search "smoke"
          omp-memory health
          omp-memory backup
          omp-memory stats
