<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <g transform="translate(72, 108)">
    <!-- database cylinder -->
    <ellipse cx="56" cy="18" rx="56" ry="18" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M0 18 v76 a56 18 0 0 0 112 0 v-76" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M0 56 a56 18 0 0 0 112 0" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
    <path d="M0 88 a56 18 0 0 0 112 0" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
    <!-- memory nodes -->
    <g fill="url(#accent2)">
      <circle cx="30" cy="38" r="5"/>
      <circle cx="82" cy="38" r="5"/>
      <circle cx="30" cy="70" r="5"/>
      <circle cx="82" cy="70" r="5"/>
    </g>
    <g stroke="#a78bfa" stroke-width="2" opacity="0.7">
      <line x1="30" y1="38" x2="82" y2="70"/>
      <line x1="82" y1="38" x2="30" y2="70"/>
    </g>
  </g>

  <text x="240" y="128" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="700" fill="#f8fafc">honcho-pi</text>
  <text x="244" y="186" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#94a3b8">Evidence-backed local memory for coding agents.</text>
  <text x="244" y="232" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#64748b">SQLite. Ranked recall. Zero cloud.</text>

  <rect x="244" y="252" width="240" height="4" rx="2" fill="url(#accent)"/>
</svg>
