[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-memory"
version = "0.2.0"
description = "Local-first SQLite memory for coding agents: capture, search, reinforce, recap."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
authors = [{ name = "alfar1zi", email = "f.alfarizii10@gmail.com" }]
keywords = ["agent", "memory", "sqlite", "fts5", "llm", "context", "opencode", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
omp-memory = "omp_memory.cli:main"

[project.urls]
Homepage = "https://github.com/alfar1zi/honcho-pi"
Repository = "https://github.com/alfar1zi/honcho-pi"
Issues = "https://github.com/alfar1zi/honcho-pi/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
